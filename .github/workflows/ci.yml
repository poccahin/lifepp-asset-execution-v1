name: a4-shadow-boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: a4-shadow-evidence-${{ matrix.os }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
