name: a4-shadow-boundary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a4-shadow-evidence-${{ matrix.os }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  byte-identical-evidence:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: a4-shadow-evidence-*
          path: reproduced-evidence
      - name: Require Ubuntu and macOS evidence to be byte-identical
        run: |
          test -d reproduced-evidence/a4-shadow-evidence-ubuntu-24.04
          test -d reproduced-evidence/a4-shadow-evidence-macos-14
          diff -ru \
            reproduced-evidence/a4-shadow-evidence-ubuntu-24.04 \
            reproduced-evidence/a4-shadow-evidence-macos-14
